[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oracle-graph-analyzer"
version = "0.1.0"
description = "Read-only Oracle database object graph explorer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "igraph>=0.11,<2",
  "oracledb>=3.2,<4",
  "pillow>=10,<13",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
