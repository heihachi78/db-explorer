services:
  ora-db:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: ora-db
    ports:
      - "1521:1521"
    volumes:
      - ora-db-volume:/opt/oracle/oradata
    restart: unless-stopped

  oracle-graph-analyzer:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_DATA_DIR: /data
      APP_PORT: ${APP_PORT:-8000}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - ./data:/data
    depends_on:
      ora-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8000}/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  ora-db-volume:
    external: true
    name: ora-db-volume
